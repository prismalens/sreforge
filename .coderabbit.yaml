reviews:
  profile: chill
  # Admission (Sumit1993/rig#150): automatic review is off. The hourly `CodeRabbit summoner`
  # routine (Sumit1993/rig scripts/coderabbit-routine) summons one PR per hour across every repo,
  # because the allowance is one review per developer per hour. Sessions never summon by hand:
  # fix, push once, reply in each thread, and the routine re-reviews. `coderabbit_review` is the
  # operator's override for a review now. Pausing after 1 reviewed commit keeps one review per head.
  auto_review:
    enabled: false
    labels:
      - "coderabbit_review"
    auto_pause_after_reviewed_commits: 1
    ignore_title_keywords:
      - "WIP"
  # Not a rate-limit lever (the limit counts reviews, not files) — this keeps PRs under
  # the OSS files-per-review cap of 50-150.
  path_filters:
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "use-cases/**/{scripts/**,Taskfile.yml,compose/**}"
      instructions: "If this PR changes a task name, flag, env var, port or file layout, the README must say so in the same PR; name the stale line if it does not."
    - path: "use-cases/**/observability/rules/**"
      instructions: "Every alert rule MUST carry a `service` label (pnpm rules-lint enforces it). Flag any rule without one."
