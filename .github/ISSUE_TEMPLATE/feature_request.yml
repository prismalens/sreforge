name: Feature request
description: Suggest an idea or improvement for sreforge.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: When evaluating an agent across runs I ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like sreforge to do. Sketches and example commands welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have tried or thought about.
    validations:
      required: false
  - type: textarea
    id: docs-impact
    attributes:
      label: Docs impact
      description: Which documentation surfaces will this change touch when shipped (cli.md verb table, run-contract.md, guides, READMEs, --help/usage strings, Taskfile descs)? "none" must be justified.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Fit
      description: sreforge is a running environment for testing prismalens.
      options:
        - label: This fits sreforge's scope: the env, its faults, or grading an RCA.
          required: false
