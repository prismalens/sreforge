name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Alert rules carry a service label
        run: pnpm rules-lint
      - name: Tests
        run: pnpm test
      - name: Compose file and Alertmanager config parse
        working-directory: use-cases/booklogr/stacks/flask-compose
        run: |
          touch compose/.env && mkdir -p .secrets
          docker compose -f compose/docker-compose.yml --profile load config --quiet
          printf 'http://example.invalid/' > .secrets/webhook-url && printf 'x' > .secrets/webhook-token
          docker run --rm --entrypoint amtool -v "$PWD/observability:/c:ro" -v "$PWD/.secrets:/etc/alertmanager/secrets:ro" \
            prom/alertmanager:v0.28.0 check-config /c/alertmanager.yml

  # The ruleset requires this name.
  gate:
    name: CI gate
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs succeeded."
