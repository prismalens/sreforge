# Throwaway: gh-workflows telemetry live test (2026-09-24). The PR carrying this file is closed, never merged.
# A valid sreforge OIDC token posting a payload that claims another repository must get 403.
name: tmp oidc spoof
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  id-token: write
jobs:
  spoof:
    runs-on: ubuntu-latest
    steps:
      - name: Post a mismatched repository under a real OIDC token
        env:
          URL: ${{ secrets.REVIEW_TELEMETRY_URL }}
        run: |
          set -euo pipefail
          ORIGIN="$(python3 -c "import sys; from urllib.parse import urlparse; u = urlparse(sys.argv[1]); print(f'{u.scheme}://{u.netloc}')" "$URL")"
          TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ORIGIN}" | jq -r .value)"
          echo "::add-mask::${TOKEN}"
          fail=0
          BODY='{"repository":"prismalens/prismalens","session_id":"spoof-test-2026-09-24","pr_number":1}'
          for path in /ingest /ingest/health /pr-state /ingest/findings; do
            code="$(curl -sS -o body.txt -w '%{http_code}' -X POST "${ORIGIN}${path}" -H "Authorization: Bearer ${TOKEN}" -H 'content-type: application/json' -d "$BODY")"
            echo "${path} -> ${code} $(cat body.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = 403 ] || fail=1
          done
          exit $fail
