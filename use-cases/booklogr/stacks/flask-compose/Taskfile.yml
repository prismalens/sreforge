# Taskfile.yml — booklogr incident-rig lifecycle (go-task · https://taskfile.dev)
#
# The runnable table-of-contents for the rig. `task --list` prints the phases in
# order; each recipe just WRAPS an existing script in scripts/ (which still run
# standalone — see scripts/README.md). Nothing is moved or replaced; this only
# makes the sequence and the entrypoints legible, and adds two things plain
# scripts don't give for free:
#   • change-detection — `build-core` is skipped when core's sources are unchanged
#   • parallelism      — `verify` runs its three probes concurrently
#
# Lifecycle:  setup → up → quiesce → arm → agent → run → verify → down
#
# task is a PINNED devDependency (@go-task/cli in the ROOT package.json) — not a
# global install — so every dev/CI gets the same version (pnpm-lock.yaml). Get it
# with `pnpm install` at the repo root. Drive it through the neutral dispatcher
# (`pnpm forge <verb> <use-case>`), which resolves the use-case to this stack:
#   pnpm forge menu booklogr     # the phase menu (task --list)
#   pnpm forge <verb> booklogr   # run a phase, e.g. `pnpm forge arm booklogr`
#   pnpm forge incident booklogr # a composite (arm -> run -> verify)
#   pnpm exec task --dir use-cases/booklogr/stacks/flask-compose -n run   # raw task flags (-n/--watch/--list)
#
# Scripts already self-resolve their own paths, so recipes are thin. The two
# cross-boundary paths (the engine in core/, the sandbox compose in infra/) are
# ../../../../ from this stack — the same hop run-incident.mjs already makes.
version: '3'

# .env (gitignored — GITEA_TOKEN, URLs) is loaded into every recipe's environment,
# the same vars the scripts expect. Copy .env.example → .env first.
dotenv: ['.env']

tasks:
  default:
    desc: "List the phases (this menu)"
    cmds: [task --list]
    silent: true

  # ── build ──────────────────────────────────────────────────────────────────
  build-core:
    desc: "Compile @sreforge/core — skipped when its TS sources are unchanged"
    dir: ../../../../core
    cmds: [npm run build]
    sources: ['src/**/*.ts', 'tsconfig.json', 'package.json']
    generates: ['dist/**/*.js']

  # ── setup (once) ─────────────────────────────────────────────────────────────
  setup:
    desc: "[once] import the substrate into the forge + author the regression"
    cmds:
      - bash scripts/import-substrate.sh
      - bash scripts/inject-regression.sh

  # ── bring-up (per session) ───────────────────────────────────────────────────
  up:
    desc: "[session] bring up the deploy plane (app + observability)"
    cmds: [bash scripts/up.sh]

  # ── arm (per run) ────────────────────────────────────────────────────────────
  arm:
    desc: "[run] reset to the regressed baseline, start the storm, confirm the alert fires"
    env:
      SCENARIO_ID: '{{.SCENARIO_ID | default (env "SCENARIO_ID") | default "latency-cache-stampede"}}'
    cmds: [bash scripts/arm-incident.sh]

  # arm-regress / arm-fire: the two halves of `arm`, exposed so auto-incident.mjs
  # can interleave the /workspace clone + box + listener between them (#22).
  # regress = substrate/forge regressed + app healthy, load quiesced (NOT firing);
  # fire = re-apply load + confirm the alert fires. Manual runs use `arm` (both).
  arm-regress:
    desc: "[run] arm phase 1: regress + bring the app up healthy, load quiesced (not firing)"
    env:
      SCENARIO_ID: '{{.SCENARIO_ID | default (env "SCENARIO_ID") | default "latency-cache-stampede"}}'
    cmds: [bash scripts/arm-regress.sh]

  arm-fire:
    desc: "[run] arm phase 2: re-apply load + confirm the alert fires (assumes arm-regress ran)"
    env:
      SCENARIO_ID: '{{.SCENARIO_ID | default (env "SCENARIO_ID") | default "latency-cache-stampede"}}'
    cmds: [bash scripts/arm-fire.sh]

  # ── agent (per run) ──────────────────────────────────────────────────────────
  agent:
    desc: "[run] clean /workspace clone + agent sandbox (vars: PROVIDER=<name> · EGRESS_ALLOWLIST=host,… · MCP=on)"
    # The agent-sandbox compose is use-case-NEUTRAL; this stack supplies the
    # booklogr deploy-plane network + app endpoint it attaches to. Optional
    # providers (ADR-0018 §2) are OPTED IN per run: PROVIDER=<name> resolves the
    # model's egress allowlist from infra/agent-sandbox/providers.json; MCP=on also
    # brings up the read-only MCP telemetry seam. No agent manifest — anything
    # beyond what's provided is denied at the boundary at runtime.
    env:
      DEPLOY_NETWORK: '{{.DEPLOY_NETWORK | default "booklogr_default"}}'
      API_URL: '{{.API_URL | default "http://booklogr-api:5000"}}'
      # Egress allowlist — set directly, or derived from PROVIDER below. EMPTY
      # (default, incl. PROVIDER=local) ⇒ zero external egress.
      EGRESS_ALLOWLIST: '{{.EGRESS_ALLOWLIST | default ""}}'
      PROVIDER: '{{.PROVIDER | default (env "PROVIDER")}}'
      MCP: '{{.MCP | default ""}}'
    cmds:
      - |
        WS="$(bash scripts/prepare-agent-workspace.sh)"
        # Optional model provider: PROVIDER=<name> → egress host(s) via the registry
        # (infra/agent-sandbox/providers.json). Explicit EGRESS_ALLOWLIST wins;
        # unknown provider fails closed; PROVIDER=local ⇒ empty ⇒ zero egress.
        if [ -z "${EGRESS_ALLOWLIST:-}" ] && [ -n "${PROVIDER:-}" ]; then
          EGRESS_ALLOWLIST="$(node ../../../../tools/provider-egress.mjs "$PROVIDER")" || exit 1
          echo "agent: provider '${PROVIDER}' -> egress '${EGRESS_ALLOWLIST:-<none>}'"
        fi
        # --build so the image picks up Dockerfile/firewall-script changes and the
        # uid build-args; the entrypoint seals egress at boot (empty allowlist).
        AGENT_UID=$(id -u) AGENT_GID=$(id -g) WORKSPACE_DIR="$WS" \
          DEPLOY_NETWORK="$DEPLOY_NETWORK" API_URL="$API_URL" \
          docker compose -p sreforge-agent \
          -f ../../../../infra/agent-sandbox/agent.yml up -d --build --force-recreate
        # Cloud run only: re-apply the firewall WITH the provider allowlist via a
        # root exec. Passed per-exec (-e), so the allowlist NEVER lands in the
        # agent's container env (a de-tell). No-op for the default zero-egress run.
        if [ -n "${EGRESS_ALLOWLIST:-}" ]; then
          # Wait for the boot seal to FINISH first — the entrypoint's own
          # init-firewall run and this re-apply would otherwise interleave (or
          # the boot run re-seals afterwards with the empty allowlist and the
          # provider egress is lost). Sealed ⇔ the EGRESS_BLOCKED rule (the
          # build's last OUTPUT rule) exists.
          for i in $(seq 1 30); do
            if DEPLOY_NETWORK="$DEPLOY_NETWORK" API_URL="$API_URL" \
                 docker compose -p sreforge-agent -f ../../../../infra/agent-sandbox/agent.yml \
                 exec -T -u 0 agent-shell sh -c 'iptables -S OUTPUT 2>/dev/null | grep -q EGRESS_BLOCKED'
            then break; fi
            [ "$i" -lt 30 ] || { echo "agent: box never sealed its boot firewall" >&2; exit 1; }
            sleep 1
          done
          echo "agent: applying egress allowlist -> ${EGRESS_ALLOWLIST}"
          DEPLOY_NETWORK="$DEPLOY_NETWORK" API_URL="$API_URL" \
            docker compose -p sreforge-agent -f ../../../../infra/agent-sandbox/agent.yml \
            exec -T -u 0 -e EGRESS_ALLOWLIST="$EGRESS_ALLOWLIST" \
            agent-shell /usr/local/sbin/init-firewall.sh
        fi
        # Optional MCP telemetry provider: MCP=on brings up the read-only seam too.
        if [ "${MCP:-}" = "on" ]; then
          DEPLOY_NETWORK="$DEPLOY_NETWORK" docker compose -p sreforge-mcp -f compose/mcp.yml up -d
          echo "agent: MCP telemetry seam up (grafana-mcp:8000/mcp)"
        fi

  # ── mcp (per run; OPTIONAL MCP telemetry transport) ──────────────────────────
  mcp:
    desc: "[run] bring up the read-only MCP telemetry seam (Grafana MCP) on the deploy plane"
    # ADR-0018 §3: reuse an off-the-shelf, read-only MCP server as the agent's
    # observability-READ transport (capability-bounded — no tool to reach github).
    # Modular overlay (own compose project); the deploy plane must already be up.
    env:
      DEPLOY_NETWORK: '{{.DEPLOY_NETWORK | default "booklogr_default"}}'
    cmds:
      - DEPLOY_NETWORK="$DEPLOY_NETWORK" docker compose -p sreforge-mcp -f compose/mcp.yml up -d
      - 'echo "MCP seam up — agent: http://grafana-mcp:8000/mcp (deploy net) · host verify: http://127.0.0.1:8009/mcp"'

  mcp:down:
    desc: "tear down the MCP telemetry seam"
    env:
      DEPLOY_NETWORK: '{{.DEPLOY_NETWORK | default "booklogr_default"}}'
    cmds:
      - DEPLOY_NETWORK="$DEPLOY_NETWORK" docker compose -p sreforge-mcp -f compose/mcp.yml down

  # ── auto (per run; ③ automation, ADR-0025) ──────────────────────────────────
  auto:
    desc: "[run] AUTOMATED incident: sandbox+listener → arm → alert push → agent → grade (vars: PROVIDER, MCP, AGENT_CMD)"
    # One self-triggered cycle: Alertmanager pushes the firing notification to
    # the box (oncall:8080, through the firewall pinhole); the agent driver
    # (AGENT_CMD, default the reference Ollama driver) takes the symptom-level
    # payload as its kickoff; grading is the existing external-runner tail.
    # No resident agent, no daemon — see scripts/auto-incident.mjs.
    deps: [build-core]
    vars:
      RUN_ID: '{{.id | default ""}}'
    env:
      RUN_ID: '{{.RUN_ID}}'
      PROVIDER: '{{.PROVIDER | default (env "PROVIDER")}}'
      MCP: '{{.MCP | default ""}}'
      EGRESS_ALLOWLIST: '{{.EGRESS_ALLOWLIST | default ""}}'
      AGENT_CMD: '{{.AGENT_CMD | default (env "AGENT_CMD")}}'
      AGY_MODEL: '{{.AGY_MODEL | default (env "AGY_MODEL")}}'
      WEBHOOK_TIMEOUT_S: '{{.WEBHOOK_TIMEOUT_S | default ""}}'
      SCENARIO_ID: '{{.SCENARIO_ID | default (env "SCENARIO_ID") | default "latency-cache-stampede"}}'
    cmds:
      - node scripts/auto-incident.mjs

  confirm-runner:
    desc: "[run] verify sreforge-runner is running AND registered with gitea"
    cmds: [node scripts/confirm-runner.mjs]

  # ── run (per run; the engine) ────────────────────────────────────────────────
  run:
    desc: "[run] drive one incident end-to-end (vars: RUNNER=scripted|external, id=<run-id>, record-dir overrides)"
    deps: [build-core]
    # Fail fast (~5s) if the CI runner is dead — avoids a 10-min timeout in the
    # GiteaCiGate. Recovery: pnpm forge forge-up (docker compose -f infra/forge/forge.yml up -d --force-recreate act_runner)
    preconditions:
      - sh: 'node scripts/confirm-runner.mjs'
        msg: "sreforge-runner is not running or not registered — recovery: docker compose -f infra/forge/forge.yml up -d --force-recreate act_runner"
    vars:
      RUN_ID: '{{.id | default ""}}'
    env:
      RUNNER: '{{.RUNNER | default (env "RUNNER") | default "scripted"}}'
      AGENT_MODE: '{{.AGENT_MODE | default (env "AGENT_MODE")}}'
      SCENARIO_ID: '{{.SCENARIO_ID | default (env "SCENARIO_ID") | default "latency-cache-stampede"}}'
      # lib-scenario.sh needs STACK to resolve scenarios/<id>/scenario.env.
      # Every other caller derives it from BASH_SOURCE before sourcing the
      # lib, but go-task's sh (mvdan/sh) gives this inline cmd no
      # BASH_SOURCE — so set it explicitly from go-task's own special var.
      STACK: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        . scripts/lib-scenario.sh
        source_scenario_env "$SCENARIO_ID"
        node scripts/run-incident.mjs {{if .RUN_ID}}--run-id {{.RUN_ID}}{{end}}

  # ── verify (any time; the probes run IN PARALLEL via deps) ────────────────────
  verify:
    desc: "boundary + de-tell + alert-pickup + egress + webhook probes, concurrently"
    deps: [verify:boundary, verify:detell, verify:pickup, verify:egress, verify:webhook]

  # NOTE: the container's configured user is now root (the entrypoint sets the
  # firewall then drops to `dev`), so every in-box `exec` passes `-u $(id -u):$(id -g)`
  # to run as the NON-root agent — the faithful perspective, and what keeps git on
  # /workspace owner-consistent.
  verify:boundary:
    desc: "in-box: endpoints reachable, harness hidden, fs/git clean"
    preconditions:
      - sh: docker inspect agent-shell >/dev/null 2>&1
        msg: "agent-shell not running — run `task agent` first"
    cmds:
      - docker cp scripts/verify-boundary.sh agent-shell:/tmp/vb.sh
      # The neutral agent.yml requires DEPLOY_NETWORK + API_URL at compose
      # parse-time (even for `exec`); this stack supplies booklogr's.
      - DEPLOY_NETWORK=booklogr_default API_URL=http://booklogr-api:5000 docker compose -p sreforge-agent -f ../../../../infra/agent-sandbox/agent.yml exec -T -u "$(id -u):$(id -g)" agent-shell sh /tmp/vb.sh

  verify:pickup:
    desc: "in-box: the agent can self-serve the firing alert (REQUIRE_FIRING=1)"
    preconditions:
      - sh: docker inspect agent-shell >/dev/null 2>&1
        msg: "agent-shell not running — run `task agent` first"
    cmds:
      - docker cp scripts/verify-alert-pickup.sh agent-shell:/tmp/vap.sh
      - DEPLOY_NETWORK=booklogr_default API_URL=http://booklogr-api:5000 docker compose -p sreforge-agent -f ../../../../infra/agent-sandbox/agent.yml exec -T -u "$(id -u):$(id -g)" -e REQUIRE_FIRING=1 agent-shell sh /tmp/vap.sh

  verify:egress:
    desc: "in-box: egress is default-deny — intra-plane reachable, github/registries blocked"
    preconditions:
      - sh: docker inspect agent-shell >/dev/null 2>&1
        msg: "agent-shell not running — run `task agent` first"
    cmds:
      - docker cp scripts/verify-egress.sh agent-shell:/tmp/ve.sh
      # Run as the NON-root agent: proves the agent itself cannot reach out.
      - DEPLOY_NETWORK=booklogr_default API_URL=http://booklogr-api:5000 docker compose -p sreforge-agent -f ../../../../infra/agent-sandbox/agent.yml exec -T -u "$(id -u):$(id -g)" agent-shell sh /tmp/ve.sh

  verify:detell:
    desc: "host: audit deploy containers for env/label/mount/log/image-clock tells"
    cmds: [bash scripts/verify-detell.sh]

  verify:webhook:
    desc: "webhook trigger (ADR-0025): oncall route live, pinhole open with a listener, other inbound denied"
    preconditions:
      - sh: docker inspect agent-shell >/dev/null 2>&1
        msg: "agent-shell not running — run `task agent` first"
    cmds:
      - node scripts/verify-webhook.mjs

  # Not in the `verify` aggregate: the MCP seam is an OPTIONAL transport, so its
  # verify would fail the aggregate whenever the seam isn't up. Run it explicitly
  # (or via `pnpm exec task --dir <stack> verify:mcp`) after `pnpm forge mcp`.
  verify:mcp:
    desc: "MCP seam: read-only, scoped, telemetry reachable, github-unreachable (needs `mcp` up + armed incident)"
    preconditions:
      - sh: docker inspect booklogr-grafana-mcp >/dev/null 2>&1
        msg: "grafana-mcp not running — run `pnpm forge mcp booklogr` first"
    cmds:
      - node scripts/verify-mcp.mjs

  # ── diagnostics ──────────────────────────────────────────────────────────────
  doctor:
    desc: "thorough preflight for misconfiguration + fresh-checkout gaps"
    cmds: [node scripts/doctor.mjs]

  quiesce:
    desc: "[run] quiesce the observability plane before arm (stop load, wipe carryover, warm-up, assert 0 firing/pending)"
    env:
      SCENARIO_ID: '{{.SCENARIO_ID | default (env "SCENARIO_ID") | default "latency-cache-stampede"}}'
    cmds: [bash scripts/quiesce.sh]

  status:
    desc: "one-shot: current p99 + which alerts are firing"
    cmds: [node scripts/status.mjs]

  console:
    desc: "operator console — CLI, or a loopback web page with SERVE=1 (PORT=7420). Harness-side, read-only."
    env:
      SERVE: '{{.SERVE | default ""}}'
      PORT: '{{.PORT | default "7420"}}'
    cmds:
      - |
        if [ -n "${SERVE:-}" ]; then node scripts/console-serve.mjs; else node scripts/console.mjs; fi

  # ── smoke (CI/e2e; sequential — each re-arms the stack) ──────────────────────
  smoke:
    desc: "run both smoke checks (positive then negative)"
    env:
      SCENARIO_ID: '{{.SCENARIO_ID | default (env "SCENARIO_ID") | default "latency-cache-stampede"}}'
    cmds:
      - task: smoke:positive
        vars:
          SCENARIO_ID: '{{.SCENARIO_ID | default "latency-cache-stampede"}}'
      - task: smoke:negative
        vars:
          SCENARIO_ID: '{{.SCENARIO_ID | default "latency-cache-stampede"}}'
  smoke:positive:
    desc: "arm + reference fix → assert verdict passed"
    env:
      SCENARIO_ID: '{{.SCENARIO_ID | default (env "SCENARIO_ID") | default "latency-cache-stampede"}}'
    cmds: [bash scripts/smoke-positive.sh]
  smoke:negative:
    desc: "arm + no-op fix → assert anti-cheat holds (not passed)"
    env:
      SCENARIO_ID: '{{.SCENARIO_ID | default (env "SCENARIO_ID") | default "latency-cache-stampede"}}'
    cmds: [bash scripts/smoke-negative.sh]

  # ── teardown ─────────────────────────────────────────────────────────────────
  down:
    desc: "[end] tear down deploy + load planes (-v); the forge persists"
    cmds: [bash scripts/down.sh]
