version: '3'

tasks:
  up:
    desc: "Start booklogr, Prometheus, Alertmanager and Grafana (first run clones booklogr)"
    cmds:
      - bash scripts/up.sh

  fault:
    desc: "Switch a fault: task fault -- <scenario> on|off"
    cmds:
      - "bash scripts/fault.sh {{.CLI_ARGS}}"

  status:
    desc: "What runs, which fault is on, what is firing (-- --json for the dashboard)"
    cmds:
      - "node scripts/status.mjs {{.CLI_ARGS}}"

  down:
    desc: "Stop everything and drop the volumes"
    cmds:
      - bash scripts/down.sh
