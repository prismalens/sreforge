# The booklogr env. The api and web build from ../substrate/booklogr (scripts/setup.sh).
# `load` (k6) runs only while a fault is on; scripts/fault.sh starts it with --profile load.
name: booklogr

x-substrate: &substrate ../substrate/booklogr

services:
  booklogr-db:
    image: postgres:16-alpine
    container_name: booklogr-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: booklogr
      POSTGRES_PASSWORD: booklogrpass
      POSTGRES_DB: booklogr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booklogr -d booklogr"]
      interval: 5s
      timeout: 5s
      retries: 5

  booklogr-api:
    build:
      context: *substrate
      dockerfile: Dockerfile
    image: booklogr-api:local
    container_name: booklogr-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://booklogr:booklogrpass@booklogr-db:5432/booklogr
      SINGLE_USER_MODE: "true"
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-5f3a9c1e7b2d4860af91c6e0d83b27154e9a0f6c2b8d471e3a5c9072f1846bd0}
      AUTH_DEFAULT_USER: ${AUTH_DEFAULT_USER:-demo@booklogr.app}
      AUTH_DEFAULT_PASSWORD: ${AUTH_DEFAULT_PASSWORD:-demo}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      DATA_PROVIDER: http://book-metadata:8080
      DATA_PROVIDER_FALLBACK: http://book-metadata:8080
      # A fault's RUNTIME_ENV lands in compose/.env; the default is the app's own.
      CACHE_TYPE: ${CACHE_TYPE:-SimpleCache}
    depends_on:
      booklogr-db:
        condition: service_healthy
      book-metadata:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 45s

  booklogr-web:
    build:
      context: ../substrate/booklogr/web
      dockerfile: Dockerfile
    image: booklogr-web:local
    container_name: booklogr-web
    ports:
      - "5150:80"
    environment:
      BL_API_ENDPOINT: http://localhost:5000/
      BL_GOOGLE_ID: ""
      BL_DEMO_MODE: "false"
    depends_on:
      booklogr-api:
        condition: service_started

  # Stand-in for the public book-metadata API, so nothing leaves the machine.
  book-metadata:
    build:
      context: ../substrate/book-metadata
      dockerfile: Dockerfile
    image: booklogr-book-metadata:local
    container_name: booklogr-book-metadata
    environment:
      SEARCH_ERROR_RATE: ${SEARCH_ERROR_RATE:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: booklogr-prometheus
    ports:
      - "9090:9090"
    volumes:
      # Directory binds, not single files: single-file binds break on recreate under WSL2 + Rancher.
      - ../observability:/etc/prometheus/conf:ro
    command:
      - --config.file=/etc/prometheus/conf/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: booklogr-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../observability:/etc/alertmanager/conf:ro
      - ../.secrets:/etc/alertmanager/secrets:ro
    command:
      - --config.file=/etc/alertmanager/conf/alertmanager.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: booklogr-grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana/dashboard-defs:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Hits the published port like an outside client; the scenarios' RATE values were tuned that way.
  load:
    image: grafana/k6:latest
    container_name: booklogr-load
    profiles: [load]
    command: ["run", "/scripts/${STORM:-booklogr-storm.js}"]
    environment:
      API_URL: http://host.docker.internal:5000
      RATE: ${RATE:-25}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../load:/scripts:ro

volumes:
  pgdata:
  grafana-data:
