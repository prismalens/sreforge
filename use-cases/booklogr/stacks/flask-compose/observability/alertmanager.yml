# Every alert goes to the agent under test. scripts/up.sh writes the URL and bearer token into ../.secrets/.
global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'service']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 5m
  receiver: agent

receivers:
  - name: agent
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook-url
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/webhook-token
