# Prometheus config for the local booklogr closed loop.
# Scrapes the booklogr API's metrics endpoint over the compose network, loads
# the alert rules, and routes firing alerts to Alertmanager.
#
# The API runs gunicorn with multiple workers, so prometheus-flask-exporter is
# wired in multiprocess mode: aggregated metrics are served on a dedicated
# metrics port (9090) by the gunicorn master, NOT on the app's request port
# (5000). That dedicated port is the scrape target.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/conf/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'booklogr-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['booklogr-api:9090']

  # The book-metadata stub's own metrics; its rules are in rules/book-metadata-rules.yml.
  - job_name: 'book-metadata'
    metrics_path: /metrics
    static_configs:
      - targets: ['book-metadata:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
